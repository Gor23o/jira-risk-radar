name: Risk Radar

on:
  schedule:
    # Every day at 05:00 UTC (09:00 in Yerevan). GitHub may start it a few minutes late.
    # Weekdays only: "0 5 * * 1-5"
    - cron: "0 5 * * *"
  workflow_dispatch: # "Run workflow" button on the Actions tab
    inputs:
      jql:
        description: "Override the JQL from config.json (leave empty to use config)"
        required: false
        default: ""
      reference_date:
        description: "Evaluate as of this date, YYYY-MM-DD (leave empty for today)"
        required: false
        default: ""
      email_to:
        description: "Send the result email to (comma-separated; leave empty for the default recipients)"
        required: false
        default: ""

# Read-only: this workflow never writes to the repo or to Jira.
permissions:
  contents: read

# If a manual run overlaps the scheduled one, let the first finish.
concurrency:
  group: risk-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The Jira and Anthropic secrets are stored in this GitHub environment
    # (Settings → Environments → .env), not as repository secrets.
    environment: ".env"
    env:
      # Runners use UTC; this makes "today" and all dates match the team's timezone.
      TZ: Asia/Yerevan
    steps:
      # Public repo: logs are public. Typed email addresses are read straight from
      # the event file (never via env, which GitHub prints) and masked as *** in
      # every later log line before anything else runs.
      - name: Hide email recipients
        run: |
          to=$(jq -r '.inputs.email_to // ""' "$GITHUB_EVENT_PATH")
          IFS=',;' read -ra parts <<< "$to"
          for address in "${parts[@]}"; do
            address=$(echo "$address" | xargs)
            if [ -n "$address" ]; then echo "::add-mask::$address"; fi
          done
          if [ -n "$(echo "$to" | xargs)" ]; then
            echo "::add-mask::$to"
            { echo "EMAIL_TO_OVERRIDE<<__END__"; echo "$to"; echo "__END__"; } >> "$GITHUB_ENV"
          fi

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Don't produce a report from code that fails its own tests.
      - name: Run tests
        id: tests
        run: npm test

      - name: Run Risk Radar
        id: radar
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          # Claude assessment; without it the run continues on rule flags ("Claude: unavailable").
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Inputs arrive as env vars, never pasted into the script, so a crafted
          # JQL string can't inject shell commands.
          INPUT_JQL: ${{ inputs.jql }}
          INPUT_REFERENCE_DATE: ${{ inputs.reference_date }}
        run: |
          mkdir -p out
          args=()
          if [ -n "$INPUT_JQL" ]; then args+=(--jql "$INPUT_JQL"); fi
          if [ -n "$INPUT_REFERENCE_DATE" ]; then args+=(--reference-date "$INPUT_REFERENCE_DATE"); fi
          npm run -s radar -- --json "${args[@]}" > out/report.json
          node scripts/ci-summary.js out/report.json >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: risk-radar-${{ github.run_number }}
          path: out/
          retention-days: 14
          if-no-files-found: ignore

      # Runs after success AND failure, so every run sends an email. If email
      # secrets are missing it only logs a warning; the run stays green.
      - name: Email results
        if: always()
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          JOB_STATUS: ${{ job.status }}
          FAILED_STEP: ${{ steps.tests.outcome == 'failure' && 'Run tests' || steps.radar.outcome == 'failure' && 'Run Risk Radar' || '' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          INPUT_REFERENCE_DATE: ${{ inputs.reference_date }}
        run: >
          node scripts/send-email.js
          --status "$JOB_STATUS"
          --report out/report.json
          --run-url "$RUN_URL"
          --failed-step "$FAILED_STEP"
          --reference-date "$INPUT_REFERENCE_DATE"
